<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0d0f14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3845/3845808.png" />
<title>Plune_call — Meeting</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="room-container">
    <!-- Header -->
    <header class="room-header">
      <div class="header-left">
        <span class="room-tag" id="roomLabel">Room: ...</span>
        <div class="user-badge">
          <div class="avatar-sm" id="userAvatar">U</div>
          <span id="whoami">you</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="copyLinkBtn" class="btn-secondary" style="font-size: 0.85rem; padding: 8px 14px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          Copy Link
        </button>
        <button id="leaveBtn" class="danger" style="padding: 8px 16px;">Leave Call</button>
      </div>
    </header>

    <!-- Main Content Area -->
    <div class="room-body">
      <!-- Video Tiles Section -->
      <section class="video-section">
        <div id="videoGrid" class="video-grid"></div>

        <!-- Floating Control Bar -->
        <nav class="control-bar">
          <button id="micBtn" class="ctrl-btn" title="Toggle Microphone" aria-label="Toggle Microphone">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
          </button>
          
          <button id="camBtn" class="ctrl-btn" title="Toggle Camera" aria-label="Toggle Camera">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
          </button>

          <button id="screenBtn" class="ctrl-btn" title="Share Screen" aria-label="Share Screen">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
          </button>

          <button id="chatToggleBtn" class="ctrl-btn" title="Open Chat" aria-label="Open Chat">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            <span id="unreadBadge" class="badge-dot hidden">0</span>
          </button>

          <button id="whiteboardBtn" class="ctrl-btn" title="Open Whiteboard" aria-label="Open Whiteboard">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></svg>
          </button>

          <button id="fileToggleBtn" class="ctrl-btn" title="Shared Files" aria-label="Shared Files">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>
          </button>
        </nav>
      </section>

      <!-- Chat Sidebar -->
      <aside id="chatPanel" class="sidebar-panel hidden">
        <div class="panel-header">
          <h3>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            In-Call Messages
          </h3>
          <button id="closeChatBtn" class="panel-close">&times;</button>
        </div>
        <div id="chatMessages" class="chat-messages"></div>
        <form id="chatForm" class="chat-input-wrap">
          <input type="text" id="chatInput" placeholder="Send a message to room..." autocomplete="off" />
          <button type="submit" style="width: auto; padding: 10px 16px;">Send</button>
        </form>
      </aside>

      <!-- Whiteboard Side Panel -->
      <aside id="whiteboardPanel" class="sidebar-panel whiteboard-panel-wrap hidden">
        <div class="panel-header">
          <h3>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"></path></svg>
            Collaborative Whiteboard
          </h3>
          <button id="closeWbBtn" class="panel-close">&times;</button>
        </div>
        <div class="wb-toolbar">
          <div class="color-picker-swatch" id="colorSwatches">
            <button class="swatch-btn selected" data-color="#6366f1" style="background: #6366f1;"></button>
            <button class="swatch-btn" data-color="#ef4444" style="background: #ef4444;"></button>
            <button class="swatch-btn" data-color="#10b981" style="background: #10b981;"></button>
            <button class="swatch-btn" data-color="#f59e0b" style="background: #f59e0b;"></button>
            <button class="swatch-btn" data-color="#ffffff" style="background: #ffffff;"></button>
          </div>
          <input type="color" id="wbColor" value="#6366f1" style="width: 32px; height: 32px; padding: 0; border: none; background: none; cursor: pointer;" />
          <input type="range" id="wbWidth" min="1" max="20" value="4" style="width: 80px;" />
          <button id="wbClear" class="btn-secondary" style="font-size: 0.8rem; padding: 6px 12px; margin-left: auto;">Clear</button>
        </div>
        <canvas id="whiteboard" width="640" height="480"></canvas>
      </aside>

      <!-- File Share Panel -->
      <aside id="filePanel" class="sidebar-panel hidden">
        <div class="panel-header">
          <h3>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path></svg>
            Shared Files
          </h3>
          <button id="closeFileBtn" class="panel-close">&times;</button>
        </div>
        <div class="file-section">
          <label class="file-dropzone">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom: 8px; color: var(--primary);"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            <div style="font-weight: 600; font-size: 0.9rem;">Click to upload & share file</div>
            <div class="subtle" style="font-size: 0.75rem; margin-top: 4px;">Max size 8 MB</div>
            <input type="file" id="fileInput" hidden />
          </label>

          <div id="fileList" class="file-list-wrap"></div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/room.js"></script>
</body>
</html>
