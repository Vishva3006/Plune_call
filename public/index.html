<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Plune_call — Modern Video Conferencing & Collaboration</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
          Plune_call
        </div>
        <h1>Welcome back</h1>
        <p class="subtle">HD Video Calls, Screen Share, Whiteboard & File Sharing</p>
      </div>

      <div class="tabs">
        <button id="tabLogin" class="tab active">Log in</button>
        <button id="tabRegister" class="tab">Create account</button>
      </div>

      <form id="authForm">
        <label>Username
          <input type="text" id="username" placeholder="Enter your username" required autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_-]{3,32}" />
        </label>
        <label>Password
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" minlength="6" />
        </label>
        <button type="submit" id="submitBtn">Log in</button>
        <p id="authError" class="error"></p>
      </form>

      <div id="roomPicker" class="hidden">
        <div style="margin-bottom: 16px; text-align: center;">
          <p id="userGreeting" class="subtle" style="font-weight: 600; color: #a5b4fc;"></p>
        </div>
        <label>Room Name
          <input type="text" id="roomId" placeholder="e.g. team-standup" maxlength="80" pattern="[A-Za-z0-9_-]{1,80}" />
        </label>
        <button id="joinBtn" style="margin-bottom: 10px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
          Join Room
        </button>
        <button id="logoutBtn" class="btn-secondary">Log out</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
</body>
</html>
